<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aleks Pausak</title>
    <meta name="description" content="Personal website of Aleks Pausak.">
    <meta name="theme-color" content="#0a0a0b">
    <link rel="icon" href="/assets/images/favicon.png">
    <style>
        :root {
            --bg: #0a0a0b;
            --fg: #ededef;
            --muted: #8a8a93;
            --faint: #26262b;
            --accent: #7cf5c4;
            --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            --mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
            display: grid;
            place-items: center;
            min-height: 100dvh;
            overflow: hidden;
        }

        ::selection {
            background: var(--accent);
            color: var(--bg);
        }

        #grid {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        main {
            position: relative;
            z-index: 1;
            width: min(440px, 100% - 48px);
            animation: rise 0.8s cubic-bezier(.2, .7, .2, 1) both;
        }

        .prompt {
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--muted);
            margin: 0 0 14px;
        }

        .prompt span {
            color: var(--accent);
        }

        .cursor {
            display: inline-block;
            width: 0.55em;
            height: 1em;
            background: var(--accent);
            vertical-align: -0.15em;
            margin-left: 2px;
            animation: blink 1.1s steps(1) infinite;
        }

        h1 {
            font-size: clamp(2.4rem, 7vw, 3.2rem);
            font-weight: 600;
            letter-spacing: -0.04em;
            line-height: 1;
            margin: 0 0 12px;
        }

        .tagline {
            color: var(--muted);
            margin: 0 0 36px;
            line-height: 1.5;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            border-top: 1px solid var(--faint);
        }

        li a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 4px;
            border-bottom: 1px solid var(--faint);
            color: var(--fg);
            text-decoration: none;
            transition: color 0.2s, padding 0.2s;
        }

        li a svg {
            width: 18px;
            height: 18px;
            flex: none;
            color: var(--muted);
            transition: color 0.2s;
        }

        li a .handle {
            margin-left: auto;
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--muted);
        }

        li a:hover, li a:focus-visible {
            color: var(--accent);
            padding-left: 10px;
            outline: none;
        }

        li a:hover svg, li a:focus-visible svg {
            color: var(--accent);
        }

        kbd {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--muted);
            border: 1px solid var(--faint);
            border-radius: 4px;
            padding: 2px 6px;
            min-width: 22px;
            text-align: center;
        }

        footer {
            margin-top: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--muted);
        }

        footer img {
            width: 22px;
            height: 22px;
            opacity: 0.7;
        }

        .palette-btn {
            background: none;
            border: 1px solid var(--faint);
            border-radius: 6px;
            color: var(--muted);
            font: inherit;
            padding: 6px 10px;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .palette-btn:hover {
            border-color: var(--muted);
            color: var(--fg);
        }

        /* Command palette */
        dialog {
            width: min(520px, 100% - 32px);
            margin: 18vh auto auto;
            padding: 0;
            border: 1px solid var(--faint);
            border-radius: 12px;
            background: rgba(18, 18, 21, 0.92);
            color: var(--fg);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
        }

        dialog[open] {
            animation: pop 0.15s ease-out;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }

        dialog input {
            width: 100%;
            background: none;
            border: none;
            border-bottom: 1px solid var(--faint);
            color: var(--fg);
            font: 1rem var(--sans);
            padding: 16px 18px;
            outline: none;
            caret-color: var(--accent);
        }

        dialog ul {
            border: none;
            padding: 6px;
            max-height: 320px;
            overflow-y: auto;
        }

        dialog li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--muted);
        }

        dialog li svg {
            width: 16px;
            height: 16px;
        }

        dialog li kbd {
            margin-left: auto;
        }

        dialog li[aria-selected="true"] {
            background: var(--faint);
            color: var(--fg);
        }

        dialog li[aria-selected="true"] svg {
            color: var(--accent);
        }

        dialog .empty {
            padding: 18px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
        }

        @keyframes pop {
            from { opacity: 0; transform: scale(0.98); }
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        @media (hover: none) {
            kbd, .palette-btn { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <canvas id="grid" aria-hidden="true"></canvas>

    <main>
        <p class="prompt"><span>~/pausak.com</span> $ whoami<i class="cursor"></i></p>
        <h1>Aleks Pausak</h1>
        <p class="tagline">A small corner of the internet for experiments, code and the occasional side project.</p>

        <ul id="links"></ul>

        <footer>
            <img src="/assets/images/favicon.png" alt="Pausak logo">
            <button class="palette-btn" id="open-palette" type="button"><span id="mod-key">⌘</span>K to navigate</button>
        </footer>
    </main>

    <dialog id="palette" aria-label="Command palette">
        <input id="palette-input" type="text" placeholder="Where to?" autocomplete="off" spellcheck="false"
            role="combobox" aria-controls="palette-list" aria-expanded="true">
        <ul id="palette-list" role="listbox"></ul>
    </dialog>

    <script>
        const icons = {
            github: '<path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/>',
            linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/>',
            x: '<path d="M4 4l11.733 16H20L8.267 4z"/><path d="M4 20l6.768-6.768M13.232 10.768 20 4"/>',
            mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>'
        };

        const links = [
            { name: "GitHub", handle: "pausak", key: "g", icon: "github", url: "https://github.com/pausak" },
            { name: "LinkedIn", handle: "apausak", key: "l", icon: "linkedin", url: "https://www.linkedin.com/in/apausak/" },
            { name: "X", handle: "@apausak", key: "x", icon: "x", url: "https://x.com/apausak" },
            { name: "Email", handle: "say hello", key: "e", icon: "mail", url: "mailto:glass.trekker602@passmail.net?subject=Hello%20from%20pausak.com" }
        ];

        const svg = (name) =>
            `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;

        function openLink(link) {
            if (link.url.startsWith('mailto:')) {
                window.location.href = link.url;
            } else {
                window.open(link.url, '_blank', 'noopener');
            }
        }

        // Link list
        document.getElementById('links').innerHTML = links.map(l => `
            <li><a href="${l.url}" ${l.url.startsWith('mailto:') ? '' : 'target="_blank" rel="noopener"'}>
                ${svg(l.icon)}<span>${l.name}</span><span class="handle">${l.handle}</span><kbd>${l.key.toUpperCase()}</kbd>
            </a></li>`).join('');

        // Command palette
        const palette = document.getElementById('palette');
        const paletteInput = document.getElementById('palette-input');
        const paletteList = document.getElementById('palette-list');
        let matches = links;
        let selected = 0;

        if (!/Mac|iPhone|iPad/.test(navigator.platform)) {
            document.getElementById('mod-key').textContent = 'Ctrl+';
        }

        function renderPalette() {
            const q = paletteInput.value.trim().toLowerCase();
            matches = links.filter(l => (l.name + ' ' + l.handle).toLowerCase().includes(q));
            selected = Math.min(selected, Math.max(matches.length - 1, 0));
            paletteList.innerHTML = matches.length
                ? matches.map((l, i) => `
                    <li role="option" data-i="${i}" aria-selected="${i === selected}">
                        ${svg(l.icon)}<span>${l.name}</span><kbd>${l.key.toUpperCase()}</kbd>
                    </li>`).join('')
                : '<div class="empty">Nothing here. Try "git".</div>';
        }

        function openPalette() {
            paletteInput.value = '';
            selected = 0;
            renderPalette();
            palette.showModal();
            paletteInput.focus();
        }

        paletteInput.addEventListener('input', () => { selected = 0; renderPalette(); });

        paletteInput.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                const step = e.key === 'ArrowDown' ? 1 : -1;
                selected = (selected + step + matches.length) % Math.max(matches.length, 1);
                renderPalette();
            } else if (e.key === 'Enter' && matches[selected]) {
                palette.close();
                openLink(matches[selected]);
            }
        });

        paletteList.addEventListener('mousemove', (e) => {
            const item = e.target.closest('li');
            if (item && +item.dataset.i !== selected) {
                selected = +item.dataset.i;
                renderPalette();
            }
        });

        paletteList.addEventListener('click', (e) => {
            const item = e.target.closest('li');
            if (item) {
                palette.close();
                openLink(matches[+item.dataset.i]);
            }
        });

        palette.addEventListener('click', (e) => {
            if (e.target === palette) palette.close();
        });

        document.getElementById('open-palette').addEventListener('click', openPalette);

        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                palette.open ? palette.close() : openPalette();
                return;
            }
            if (palette.open || e.metaKey || e.ctrlKey || e.altKey) return;
            if (e.key === '/') {
                e.preventDefault();
                openPalette();
                return;
            }
            const link = links.find(l => l.key === e.key.toLowerCase());
            if (link) openLink(link);
        });

        // Interactive dot grid
        const canvas = document.getElementById('grid');
        const ctx = canvas.getContext('2d');
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const SPACING = 26;
        const RADIUS = 180;
        const pointer = { x: -9999, y: -9999 };
        const smooth = { x: -9999, y: -9999 };
        let width, height;

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            if (reducedMotion) draw(0);
        }

        function draw(t) {
            ctx.clearRect(0, 0, width, height);
            smooth.x += (pointer.x - smooth.x) * 0.12;
            smooth.y += (pointer.y - smooth.y) * 0.12;

            for (let x = SPACING / 2; x < width; x += SPACING) {
                for (let y = SPACING / 2; y < height; y += SPACING) {
                    const dx = x - smooth.x;
                    const dy = y - smooth.y;
                    const dist = Math.hypot(dx, dy);
                    const pull = Math.max(0, 1 - dist / RADIUS);
                    const wave = (Math.sin(x * 0.012 + t * 0.0006) + Math.cos(y * 0.014 + t * 0.0005)) * 0.5;
                    const ambient = 0.12 + wave * 0.06;

                    // Dots near the pointer are pushed outward and lit up
                    const px = x + (dist ? dx / dist : 0) * pull * 14;
                    const py = y + (dist ? dy / dist : 0) * pull * 14;

                    ctx.fillStyle = pull > 0
                        ? `rgba(124, 245, 196, ${ambient + pull * 0.85})`
                        : `rgba(237, 237, 239, ${ambient})`;
                    ctx.beginPath();
                    ctx.arc(px, py, 1 + pull * 1.4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            if (!reducedMotion) requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('pointermove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
        document.documentElement.addEventListener('mouseleave', () => { pointer.x = pointer.y = -9999; });

        resize();
        if (!reducedMotion) requestAnimationFrame(draw);
    </script>
</body>

</html>
